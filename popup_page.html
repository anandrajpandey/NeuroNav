<body>
  <div id="neuronav-root">
    <h1>NeuroNav Version 2.1.0</h1>

    <!-- SINGLE VIDEO CONTAINER -->
    <div id="video-wrapper">
      <video id="video" autoplay playsinline></video>
    </div>

    <canvas id="canvas" class="hidden"></canvas>
    <p id="gesture-text">Gesture: <span id="gesture">Detecting...</span></p>

    <div id="calibration-container">
      <div class="calib-dot" id="dot1"></div>
      <div class="calib-dot" id="dot2"></div>
      <div class="calib-dot" id="dot3"></div>
      <div class="calib-dot" id="dot4"></div>
      <div class="calib-dot" id="dot5"></div>
    </div>

    <button id="start-calibration">Start Calibration</button>
  </div>
</body>
